<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 禁用 Vercel 初始状态加载 -->
    <meta name="vercel-initial-state" content="disabled" />
    <!-- 优化初始加载性能 -->
    <link rel="preload" href="/src/main.tsx" as="script" />
    <!-- 隐藏 Vercel 注入的加载动画 -->
    <style>
      /* 隐藏 Vercel 加载动画 */
      [data-vercel-loading] {
        display: none !important;
      }
      /* 确保页面加载时立即显示内容 */
      body {
        opacity: 1 !important;
        transition: none !important;
      }
    </style>
  </head>
  <body class="dark:bg-gray-900" data-vercel-no-initial-state>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
